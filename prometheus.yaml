global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'microk8s-cert-expiry'
    static_configs:
      - targets:
          - 192.168.1.5:9100

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 192.168.144.198:9100
          - 192.168.144.151:9100
          - 172.233.193.238:9100
          - 192.168.181.210:9100
          - 172.233.197.223:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: 192.168.144.198:9100
        target_label: nodename
        replacement: Ti-preprod-worker-0
      - source_labels: [__address__]
        regex: 192.168.144.151:9100
        target_label: nodename
        replacement: Ti-preprod-worker-1
      - source_labels: [__address__]
        regex: 172.233.197.223:9100
        target_label: nodename
        replacement: VPN-Server-Preprod
      - source_labels: [__address__]
        regex: 172.233.193.238:9100
        target_label: nodename
        replacement: engine-master
      - source_labels: [__address__]
        regex: 192.168.181.210:9100
        target_label: nodename
        replacement: Ti-preprod-worker-2

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: 'kafka-exporter'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9308"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9308
      action: replace
    - target_label: component
      replacement: kafka


  - job_name: 'mysql-exporter'
    kubernetes_sd_configs:
    - role: pod

    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mysql-slave-8-1
      action: keep

    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep

    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace

    - target_label: role
      replacement: slave
        
  - job_name: 'app_db_health'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['mysql-healthcheck-3-11:5000/health/db']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
